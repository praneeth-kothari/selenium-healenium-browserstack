# Healenium client configuration (Typesafe Config format).
# Overrides the defaults bundled in healenium-web (hlm.server.url = localhost:7878).
# The healing store runs locally via docker-compose.yml even though the
# browser session itself runs on the BrowserStack cloud.
# 127.0.0.1 (not "localhost"): Java HttpClient resolves localhost to IPv6 ::1
# first and throws ConnectException when Docker publishes IPv4 only.
recovery-tries = 2
score-cap = 0.6
heal-enabled = true
backlight-healing = true
proxy = false
hlm.server.url = "http://127.0.0.1:8000"
hlm.imitator.url = "http://127.0.0.1:8000"
hlm.ai.url = "http://127.0.0.1:8000"
