services:
  postgre:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: healenium_user
      POSTGRES_PASSWORD: healenium_pass
      POSTGRES_DB: healenium_db
    ports:
      - "5432:5432"
    volumes:
      - ./healenium-db-init:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healenium_user -d healenium_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  healenium:
    image: healenium/hlm-backend:3.4.1
    environment:
      SERVER_PORT: 8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgre:5432/healenium_db?currentSchema=public
      SPRING_DATASOURCE_USERNAME: healenium_user
      SPRING_DATASOURCE_PASSWORD: healenium_pass
      SPRING_LIQUIBASE_DEFAULT_SCHEMA: healenium
    ports:
      - "8000:8000"
    depends_on:
      postgre:
        condition: service_healthy
