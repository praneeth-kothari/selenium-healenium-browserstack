heal-enabled=true
# Healing store runs locally via docker-compose.yml even though the
# browser session itself runs on the BrowserStack cloud.
# 127.0.0.1 (not "localhost"): Java HttpClient resolves localhost to IPv6 ::1
# first and throws ConnectException when Docker publishes IPv4 only.
serverHost=127.0.0.1
serverPort=8000
recoveryTries=2
score-cap=0.6
