name: BrowserStack Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docker-compose.yml'
      - '.github/workflows/browserstack-tests.yml'

jobs:
  browserstack:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Healenium backend (healing store)
        run: docker compose up -d

      - name: Wait for backend to accept connections
        run: |
          for i in $(seq 1 40); do
            if (echo > /dev/tcp/localhost/8000) 2>/dev/null; then
              echo "Backend is listening on port 8000"; break
            fi
            echo "Waiting for backend ($i/40)"; sleep 2
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Notice - credentials missing
        if: ${{ env.BROWSERSTACK_USERNAME == '' || env.BROWSERSTACK_ACCESS_KEY == '' }}
        run: echo "::notice::Set repo secrets BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY to run the cloud tests."

      - name: Run tests on BrowserStack
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        run: |
          set -o pipefail
          mvn -B clean test 2>&1 | tee mvn_output.log

      - name: Diagnostics (log tail - kept short on purpose)
        if: always()
        run: |
          echo "===== MVN OUTPUT (last 60 lines) ====="
          tail -n 60 mvn_output.log 2>/dev/null || echo "no mvn log"
          echo "===== POSTGRES ERRORS ====="
          docker compose logs postgre 2>/dev/null | grep -iE "error|fatal|schema" | tail -n 15 || echo "none"
          echo "===== HEALENIUM BACKEND ERRORS ====="
          docker compose logs healenium 2>/dev/null | grep -iE "error|exception|schema|liquibase" | tail -n 25 || echo "none"
