name: BrowserStack Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docker-compose.yml'
      - '.github/workflows/browserstack-tests.yml'

jobs:
  browserstack:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Healenium backend (healing store)
        run: docker compose up -d

      - name: Wait for backend to actually listen (HTTP code check)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ 2>/dev/null || true)
            [ -z "$code" ] && code=000
            if [ "$code" != "000" ]; then
              echo "Backend responding (HTTP $code) after $i checks"; break
            fi
            echo "Backend not listening yet ($i/60)"; sleep 2
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Notice - credentials missing
        if: ${{ env.BROWSERSTACK_USERNAME == '' || env.BROWSERSTACK_ACCESS_KEY == '' }}
        run: echo "::notice::Set repo secrets BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY to run the cloud tests."

      - name: Run tests on BrowserStack
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        run: |
          set -o pipefail
          mvn -B clean test 2>&1 | tee mvn_output.log

      - name: Diagnostics (kept at tail on purpose)
        if: always()
        run: |
          echo "===== BACKEND: selector/save/heal/session lines ====="
          docker compose logs healenium 2>/dev/null | grep -iE "selector|save|heal|session|error|exception" | tail -n 60 || echo "none"
          echo "===== BACKEND LOG TAIL (last 40) ====="
          docker compose logs --tail=40 healenium 2>/dev/null || echo "none"
          echo "===== POSTGRES LOG TAIL (full) ====="
          docker compose logs --tail=15 postgre 2>/dev/null || echo "none"
          echo "===== MVN ERRORS ====="
          grep -E "\[ERROR\]" mvn_output.log 2>/dev/null | head -n 40 || echo "none"
          echo "===== MVN TAIL ====="
          tail -n 30 mvn_output.log 2>/dev/null || echo "no mvn log"
