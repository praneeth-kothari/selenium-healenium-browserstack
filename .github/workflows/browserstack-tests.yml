name: BrowserStack Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/browserstack-tests.yml'

jobs:
  browserstack:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Healenium backend (healing store)
        run: docker compose up -d

      - name: Wait for backend to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/actuator/health > /dev/null 2>&1 || \
               curl -sf http://localhost:8000 > /dev/null 2>&1; then
              echo "Backend is up"; break
            fi
            echo "Waiting for backend ($i/30)"; sleep 2
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Notice - credentials missing
        if: ${{ env.BROWSERSTACK_USERNAME == '' || env.BROWSERSTACK_ACCESS_KEY == '' }}
        run: echo "::notice::Set repo secrets BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY to run the cloud tests."

      - name: Run tests on BrowserStack
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        run: mvn -B clean test

      - name: Dump Healenium backend logs
        if: always()
        run: docker compose logs --tail=100 healenium
